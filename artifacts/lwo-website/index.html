<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/lwo-logomark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--app-head-->

    <!-- Hero LCP preload — homepage only, cached on subsequent visits -->
    <link rel="preload" as="image" href="/images/lwo-hero-640.webp" type="image/webp" media="(max-width: 768px)" />
    <link rel="preload" as="image" href="/images/lwo-hero-1024.webp" type="image/webp" media="(min-width: 769px)" />

    <!-- Montserrat — non-blocking load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
    />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
